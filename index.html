<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>VLibrasJS Demo</title>
    <style>
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        #form {
            display: flex;
            justify-content: center;
        }

        #input {
            border: 2px solid dodgerblue;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1.5rem;
        }

        #input:focus {
            outline: none !important;
        }

        #wrapper {
            width: 100%;
            margin: 0 auto;
            border: 2px solid dodgerblue;
            border-radius: 10px;
            overflow: hidden;
            max-width: 1200px;
        }
    </style>
</head>

<body>
    <form id="form">
        <input type="text" id="input" placeholder="Digite um texto" autocomplete="off">
    </form>

    <div id="wrapper"></div>
    <script src="./vlibras.js"></script>
    <script>
        var player = new VLibras.Player({
            target: { name: 'rnp_webgl', path: './target' }
        });

        player.on('load', function () {
            ;
            //    console.log('Player loaded');
        });

        player.load(document.getElementById('wrapper'));
    </script>

    <script>
        const form = document.getElementById("form");
        const input = document.getElementById("input");

        form.addEventListener("submit", e => {
            e.preventDefault();
            const texto = input.value;
            player.translate(texto)
        })
    </script>
</body>

</html>
